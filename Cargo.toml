[package]
name = "hping"
version = "3.1.0"
edition = "2021"
authors = ["Salvatore Sanfilippo <antirez@invece.org>", "hping contributors"]
description = "A command-line oriented TCP/IP packet assembler and analyzer rewritten in Rust"
readme = "README.md"
license = "GPL-2.0"
repository = "https://github.com/antirez/hping"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
rand = "0.8"
dns-lookup = "2.0"
ctrlc = "3.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
