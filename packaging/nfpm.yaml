name: hping
arch: amd64
platform: linux
version: VERSION_PLACEHOLDER
release: "1"
section: net
priority: optional
maintainer: KingIronMan2011
description: A command-line oriented TCP/IP packet assembler and analyzer rewritten in Rust.
vendor: antirez
homepage: http://www.hping.org
license: GPL-2.0
contents:
  - src: release/package/usr/sbin/hping
    dst: /usr/sbin/hping
    file_info:
      mode: 0755
  - src: docs/hping3.8
    dst: /usr/share/man/man8/hping.8
    file_info:
      mode: 0644
overrides:
  deb:
    depends:
      - libc6
  rpm:
    depends:
      - glibc
  archlinux:
    depends:
      - glibc
