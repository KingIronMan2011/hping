name: Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 3.1.2)'
        required: true
        type: string
      tag:
        description: 'Tag to create (e.g. v3.1.2)'
        required: true
        type: string

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v?([0-9]+(\.[0-9]+)*.*) ]]; then
            version="${BASH_REMATCH[1]}"
          else
            version=$(grep '^version' Cargo.toml | head -1 | cut -d '"' -f 2 || echo "3.1.1")
            if [ -z "$version" ]; then version="3.1.1"; fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Run tests
        run: cargo test --verbose

      - name: Build release binary
        run: |
          cargo build --release
          .\target\release\hping.exe -v

      - name: Package Windows asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          Compress-Archive -Path target/release/hping.exe, README.md, LICENSE.md -DestinationPath "release-assets/hping-$env:VERSION-windows-x86_64.zip"

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: hping-windows-packages
          path: release-assets/*
          if-no-files-found: error

  build-and-publish:
    name: Build Linux and Publish
    runs-on: ubuntu-latest
    needs: build-windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ github.event.inputs.version }}"
            tag="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v?([0-9]+(\.[0-9]+)*.*) ]]; then
            version="${BASH_REMATCH[1]}"
            tag="v$version"
          else
            version=$(grep '^version' Cargo.toml | head -1 | cut -d '"' -f 2 || echo "3.1.1")
            if [ -z "$version" ]; then version="3.1.1"; fi
            tag="v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Run tests
        run: cargo test --verbose

      - name: Build release binary
        run: |
          cargo build --release
          ./target/release/hping -v

      - name: Prepare binary staging directory
        run: |
          mkdir -p release/package/usr/sbin release-assets
          cp target/release/hping release/package/usr/sbin/hping
          chmod 755 release/package/usr/sbin/hping
          tar -czf "release-assets/hping-${VERSION}-linux-x86_64.tar.gz" -C release/package/usr/sbin hping

      - name: Validate package staging
        run: |
          test -x release/package/usr/sbin/hping
          test -f packaging/nfpm.yaml
          grep -q 'release/package/usr/sbin/hping' packaging/nfpm.yaml

      - name: Build Debian, RPM, and Arch packages
        run: |
          mkdir -p release
          sed "s/VERSION_PLACEHOLDER/${VERSION}/" packaging/nfpm.yaml > release/nfpm.yaml
          docker run --rm -v "$PWD:/work" -w /work goreleaser/nfpm:latest package --config release/nfpm.yaml --packager deb --target "release-assets/hping_${VERSION}_amd64.deb"
          docker run --rm -v "$PWD:/work" -w /work goreleaser/nfpm:latest package --config release/nfpm.yaml --packager rpm --target "release-assets/hping-${VERSION}-1.x86_64.rpm"
          docker run --rm -v "$PWD:/work" -w /work goreleaser/nfpm:latest package --config release/nfpm.yaml --packager archlinux --target "release-assets/hping-${VERSION}-1-x86_64.pkg.tar.zst"
          test -s "release-assets/hping_${VERSION}_amd64.deb"
          test -s "release-assets/hping-${VERSION}-1.x86_64.rpm"
          test -s "release-assets/hping-${VERSION}-1-x86_64.pkg.tar.zst"

      - name: Download Windows release asset
        uses: actions/download-artifact@v4
        with:
          name: hping-windows-packages
          path: release-assets

      - name: Generate Linux repository manifest
        run: |
          cat > linux-repo-manifest.json <<EOF
          [
            { "format": "debian", "package": "release-assets/hping_${VERSION}_amd64.deb" },
            { "format": "rpm", "package": "release-assets/hping-${VERSION}-1.x86_64.rpm", "release": "41", "arch": "x86_64" },
            { "format": "arch", "package": "release-assets/hping-${VERSION}-1-x86_64.pkg.tar.zst", "arch": "x86_64" }
          ]
          EOF

      - name: Publish Linux packages to repo.kingironman.dev
        uses: KingIronMan2011/linux-repo@main
        with:
          token: ${{ secrets.LINUX_REPO_PUBLISH_TOKEN }}
          manifest: linux-repo-manifest.json

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release-assets/*'

      - name: Upload all build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hping-all-packages
          path: release-assets/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: hping ${{ steps.version.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
